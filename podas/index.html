<head>
<meta charset="utf-8">

<title>Data cleansing · cosmos.ai</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:15px/1.6 -apple-system,'Segoe UI',Roboto,sans-serif;
  background:#0f3b2e;color:#fff;display:flex;align-items:center;
  justify-content:center;padding:32px 22px;text-align:center;
  -webkit-font-smoothing:antialiased}
main{max-width:430px;width:100%}

/* El círculo: dos anillos girando a distinta velocidad y en sentido contrario.
   Uno solo se lee como "cargando y ya"; dos dan la idea de proceso en curso. */
.spin{position:relative;width:78px;height:78px;margin:0 auto 34px}
.spin i{position:absolute;inset:0;border-radius:50%;
  border:2px solid transparent;display:block}
.spin i:nth-child(1){border-top-color:#ffffff;border-right-color:#ffffff59;
  animation:gira 1.15s linear infinite}
.spin i:nth-child(2){inset:13px;border-bottom-color:#7fd1b0;
  border-left-color:#7fd1b059;animation:gira 1.7s linear infinite reverse}
@keyframes gira{to{transform:rotate(360deg)}}
/* quien haya pedido menos animación no ve nada girar */
@media(prefers-reduced-motion:reduce){
  .spin i{animation:none}
  .spin i:nth-child(1){border-color:#ffffff8a}
  .spin i:nth-child(2){border-color:#7fd1b0}
}

h1{font-size:12px;font-weight:600;letter-spacing:3.4px;text-transform:uppercase;
  opacity:.95}
p{font-size:15px;font-weight:300;line-height:1.62;opacity:.74;margin-top:20px}
.pie{margin-top:44px;padding-top:26px;border-top:1px solid #ffffff1f;
  width:min(100vw - 44px, 640px);margin-left:50%;transform:translateX(-50%)}
.marca{display:flex;align-items:center;justify-content:center;gap:16px}
.marca .lg{width:auto;opacity:.92;display:block;flex:0 0 auto}
.marca i{width:1px;height:15px;background:#ffffff2e;flex:0 0 auto}
/* cada caja trae distinto aire: se compensa para que los textos vayan en línea */
.lg-eureka{transform:translateY(-1.4px)}
.lg-astra{transform:translateY(-.2px)}
.lg-cosmos{transform:translateY(1.5px)}
.nota{font-size:10.5px;opacity:.4;margin-top:18px;letter-spacing:.3px;
  line-height:1.6}

/* La fila de marcas mide 592 px con los logos a tamaño pleno y no se encogía:
   por debajo de ~620 px de ventana desbordaba, aparecía scroll horizontal y la
   página se abría pegada a la izquierda, con todo el contenido corrido. Aquí se
   escala por tramos y se permite envolver como última red. */
.marca{flex-wrap:wrap;max-width:100%}
body{overflow-x:hidden}
@media(max-width:680px){
  .marca{gap:13px}
  .lg-eureka{height:16px!important}
  .lg-astra{height:19px!important}
  .lg-cosmos{height:22px!important}
}
@media(max-width:480px){
  .marca{gap:10px}
  .lg-eureka{height:12px!important}
  .lg-astra{height:14px!important}
  .lg-cosmos{height:16px!important}
  .marca i{height:11px}
  .spin{width:64px;height:64px;margin-bottom:28px}
  p{font-size:14px}
}
</style>
</head>
