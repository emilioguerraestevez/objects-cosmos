<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#0d0c0a">
<title>Registro de Staff · 15 de Septiembre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Cinzel:wght@500;600;700&family=Barlow:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#D9B36C; --gold-lt:#EAD9AE; --red:#8E2A2A; --red-deep:#6B1616;
    --green:#1E4635; --ink:#0d0c0a; --panel:#171410;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(ellipse at 50% -10%, rgba(142,42,42,.25), transparent 55%),
      var(--ink);
    color:var(--gold-lt);
    font-family:'Barlow',-apple-system,'Helvetica Neue',Arial,sans-serif;
    min-height:100vh; display:flex; justify-content:center;
  }
  #wrap{width:100%;max-width:520px;padding:30px 22px 34px;display:flex;flex-direction:column;min-height:100vh}

  .top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #3a2f1e;padding-bottom:14px}
  .brand{font-family:'Cinzel',serif;font-weight:600;color:var(--gold);font-size:14px;letter-spacing:.14em;text-transform:uppercase}
  .brand span{color:var(--red);opacity:.95}
  .counter{font-size:12px;font-weight:700;color:var(--gold-lt);opacity:.7;text-align:right;font-family:'Cinzel',serif;letter-spacing:.04em}
  .counter b{color:var(--red);font-variant-numeric:tabular-nums;font-size:16px;font-family:'Barlow',sans-serif}

  .sparks{text-align:center;color:var(--gold);opacity:.75;font-size:15px;letter-spacing:.5em;margin:22px 0 6px;padding-left:.5em}

  h1{
    font-family:'Rye',cursive; font-weight:400; text-transform:uppercase;
    font-size:40px; line-height:1.05; text-align:center; margin:6px 0 2px;
    color:var(--red); text-shadow:0 1px 0 #c98f4a, 0 2px 6px rgba(0,0,0,.6);
    letter-spacing:.01em;
  }
  h1 .oro{color:var(--gold-lt); text-shadow:0 1px 0 var(--green), 0 2px 6px rgba(0,0,0,.6);}
  .sub{color:#b8a888;font-size:13.5px;margin:2px 0 26px;font-weight:600;text-align:center;
    font-family:'Cinzel',serif;letter-spacing:.03em}

  label{display:block;font-family:'Cinzel',serif;font-weight:600;font-size:11.5px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--gold);margin-bottom:7px}
  .field{margin-bottom:18px}
  input{
    width:100%;font-family:'Barlow',sans-serif;font-weight:700;font-size:19px;
    padding:15px 15px;border:1.5px solid #4a3a22;border-radius:3px;background:var(--panel);color:var(--gold-lt);
  }
  input:focus{outline:none;border-color:var(--gold)}
  input::placeholder{color:#6b5c42;font-weight:600}
  .field.invalid input{border-color:var(--red)}
  .err{color:#e58a8a;font-size:12.5px;font-weight:700;margin-top:6px;display:none;font-family:'Cinzel',serif}
  .field.invalid .err{display:block}

  button.cta{
    width:100%;margin-top:10px;font-family:'Rye',cursive;font-weight:400;font-size:22px;letter-spacing:.03em;
    text-transform:uppercase;color:#241205;
    background:linear-gradient(180deg,var(--gold-lt),var(--gold));
    border:1px solid #8a6a2e;border-radius:3px;
    padding:16px 10px;cursor:pointer;box-shadow:0 5px 0 var(--red-deep);
  }
  button.cta:active{transform:translateY(3px);box-shadow:0 2px 0 var(--red-deep)}

  .toast{
    margin-top:16px;padding:13px 16px;border-radius:3px;background:var(--green);color:var(--gold-lt);
    font-weight:700;text-align:center;font-size:15px;opacity:0;transform:translateY(-6px);
    transition:opacity .18s ease, transform .18s ease;border:1px solid #2f5c47;
  }
  .toast.show{opacity:1;transform:translateY(0)}
  .toast.err{background:var(--red-deep);border-color:#8a2f2f}

  .foot{margin-top:auto;padding-top:26px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
  .foot img{height:46px;opacity:.92;filter:drop-shadow(0 0 6px rgba(217,179,108,.25))}
  .foot .wordmark{font-family:'Cinzel',serif;font-weight:600;font-size:12px;letter-spacing:.16em;color:var(--gold);text-transform:uppercase}
  .foot .url{color:#5c4f3a;font-size:11px;font-weight:600;margin-top:2px}
</style>
</head>
<body>
<div id="wrap">
  <div class="top">
    <div class="brand">STAFF · <span>15 SEPT</span></div>
    <div class="counter">EN ESTE DISPOSITIVO<br><b id="count">0</b> registrados</div>
  </div>

  <div class="sparks">✦ ✧ ✦</div>
  <h1>Registro <span class="oro">en puerta</span></h1>
  <div class="sub">Reunión de staffers · Alcaldía Cuauhtémoc</div>

  <form id="doorForm" novalidate>
    <div class="field" id="fNombre">
      <label for="nombre">Nombre completo</label>
      <input id="nombre" name="nombre" type="text" placeholder="Nombre de la persona" autocomplete="off">
      <div class="err">Escribe el nombre.</div>
    </div>
    <div class="field" id="fTel">
      <label for="telefono">Teléfono (10 dígitos)</label>
      <input id="telefono" name="telefono" type="tel" inputmode="numeric" placeholder="55 1234 5678" autocomplete="off">
      <div class="err">Escribe un teléfono a 10 dígitos.</div>
    </div>
    <div class="field" id="fDep">
      <label for="dependencia">Dependencia</label>
      <input id="dependencia" name="dependencia" type="text" placeholder="Ej. Servicios Urbanos" autocomplete="off">
      <div class="err">Escribe la dependencia.</div>
    </div>
    <button class="cta" type="submit">Registrar</button>
  </form>

  <div class="toast" id="toast"></div>

<script>
(function(){
  var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxdeoygxfzDNiyPED94C6ZkTlXdXcMiA_TWVy_3UaPZAP3o4Iv3sB8_CFW2SEKk7DQ_/exec';
  var form = document.getElementById('doorForm');
  var nombreEl = document.getElementById('nombre');
  var telEl = document.getElementById('telefono');
  var depEl = document.getElementById('dependencia');
  var toast = document.getElementById('toast');
  var countEl = document.getElementById('count');
  var count = 0;
  var toastTimer = null;

  function showToast(msg, isErr){
    toast.textContent = msg;
    toast.className = 'toast show' + (isErr ? ' err' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.className = 'toast'; }, 2200);
  }

  form.addEventListener('submit', function(ev){
    ev.preventDefault();
    var nombre = nombreEl.value.trim();
    var tel = telEl.value.replace(/\D/g,'');
    var dep = depEl.value.trim();

    var ok = true;
    document.getElementById('fNombre').classList.toggle('invalid', nombre.length < 2);
    if (nombre.length < 2) ok = false;
    document.getElementById('fTel').classList.toggle('invalid', tel.length !== 10);
    if (tel.length !== 10) ok = false;
    document.getElementById('fDep').classList.toggle('invalid', dep.length < 2);
    if (dep.length < 2) ok = false;
    if (!ok) return;

    fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type':'application/x-www-form-urlencoded'},
      body: 'nombre=' + encodeURIComponent(nombre) + '&telefono=' + encodeURIComponent(tel) + '&dependencia=' + encodeURIComponent(dep)
    }).then(function(){
      count++;
      countEl.textContent = count;
      showToast('✓ Registrado — ' + nombre.split(' ')[0]);
    }).catch(function(){
      showToast('Sin conexión — anótalo a mano y reintenta luego', true);
    });

    form.reset();
    nombreEl.focus();
  });
})();
</script>
